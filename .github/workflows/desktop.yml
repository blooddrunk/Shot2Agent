name: Windows desktop package
on: [push, pull_request]
concurrency:
  group: desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: corepack pnpm install --frozen-lockfile
      - run: npm run desktop:build
      - run: cargo test --release --features tauri/custom-protocol --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: npm run desktop:package
      - name: Exercise packaged Rust to Node pipes and clean shutdown
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$pwd/build/Shot2Agent/Shot2Agent.exe" -ArgumentList '--staging','--smoke' -PassThru
          if (-not $proc.WaitForExit(45000)) { $proc.Kill(); throw 'packaged smoke exceeded 45 seconds' }
          Get-Content build/Shot2Agent/SMOKE.txt
          if ($proc.ExitCode -ne 0) { throw "packaged IPC smoke exit $($proc.ExitCode)" }
          Compress-Archive -Path build/Shot2Agent -DestinationPath build/Shot2Agent-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Shot2Agent-Windows-x64
          path: build/Shot2Agent-Windows-x64.zip
          if-no-files-found: error
