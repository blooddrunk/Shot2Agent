name: Windows desktop package
on: [push, pull_request]
concurrency:
  group: desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: corepack pnpm install --frozen-lockfile
      - run: npm run desktop:build
      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --release --features tauri/custom-protocol --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Isolated hosted WGC and Unicode target API acceptance
        run: node scripts/windows/native-api-smoke.mjs
      - run: npm run desktop:package
      - name: Exercise packaged Rust to Node pipes and clean shutdown
        shell: pwsh
        run: |
          $clipboardScript = (Resolve-Path build/Shot2Agent/runtime/dist/packages/local/src/clipboard.ps1).Path
          Set-Content -LiteralPath $clipboardScript -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          $credentialScript = (Resolve-Path build/Shot2Agent/runtime/dist/packages/worker/src/gateway-credential.ps1).Path
          Set-Content -LiteralPath $credentialScript -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          $policyScript = (Resolve-Path build/Shot2Agent/runtime/dist/packages/worker/src/claude-policy.ps1).Path
          Set-Content -LiteralPath $policyScript -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          & "$pwd/build/Shot2Agent/runtime/node.exe" scripts/windows/claude-policy-smoke.mjs "$pwd/build/Shot2Agent/runtime/dist/packages/worker/src/process.js"
          if ($LASTEXITCODE -ne 0) { throw "packaged Claude policy smoke exit $LASTEXITCODE" }
          & "$pwd/build/Shot2Agent/runtime/node.exe" scripts/windows/credential-store-smoke.mjs "$pwd/build/Shot2Agent/runtime/dist/packages/worker/src/gateway.js"
          if ($LASTEXITCODE -ne 0) { throw "packaged Credential Manager smoke exit $LASTEXITCODE" }
          & "$pwd/build/Shot2Agent/runtime/node.exe" scripts/gateway-test-smoke.mjs "$pwd/build/Shot2Agent/runtime/dist/packages/worker/src/gateway-test.js"
          if ($LASTEXITCODE -ne 0) { throw "packaged Gateway fixture smoke exit $LASTEXITCODE" }
          $proc = Start-Process -FilePath "$pwd/build/Shot2Agent/Shot2Agent.exe" -ArgumentList '--staging','--smoke' -PassThru
          if (-not $proc.WaitForExit(45000)) { $proc.Kill(); throw 'packaged smoke exceeded 45 seconds' }
          Get-Content build/Shot2Agent/SMOKE.txt
          if ($proc.ExitCode -ne 0) { throw "packaged IPC smoke exit $($proc.ExitCode)" }
          $proc = Start-Process -FilePath "$pwd/build/Shot2Agent/Shot2Agent.exe" -ArgumentList '--staging','--tray-smoke' -PassThru
          if (-not $proc.WaitForExit(45000)) { $proc.Kill(); throw 'native tray smoke exceeded 45 seconds' }
          Get-Content build/Shot2Agent/TRAY-SMOKE.txt
          if ($proc.ExitCode -ne 0) { throw "native tray smoke exit $($proc.ExitCode)" }
          $proc = Start-Process -FilePath "$pwd/build/Shot2Agent/Shot2Agent.exe" -ArgumentList '--staging','--ui-smoke' -WindowStyle Hidden -PassThru
          if (-not $proc.WaitForExit(45000)) { $proc.Kill(); throw 'packaged WebView smoke exceeded 45 seconds' }
          Get-Content build/Shot2Agent/UI-SMOKE.txt
          if ($proc.ExitCode -ne 0) { throw "packaged WebView smoke exit $($proc.ExitCode)" }
          Compress-Archive -Path build/Shot2Agent -DestinationPath build/Shot2Agent-Windows-x64.zip
          $zipHash = (Get-FileHash build/Shot2Agent-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content build/SHA256SUMS.txt "$zipHash  Shot2Agent-Windows-x64.zip"
          $extracted = Join-Path $env:RUNNER_TEMP 'Shot2Agent-extracted'
          Expand-Archive build/Shot2Agent-Windows-x64.zip $extracted
          $bundle = Join-Path $extracted 'Shot2Agent'
          & "$bundle/runtime/node.exe" scripts/windows/portable-verify.mjs $bundle
          if ($LASTEXITCODE -ne 0) { throw "extracted portable verification exit $LASTEXITCODE" }
          $proc = Start-Process -FilePath "$bundle/Shot2Agent.exe" -ArgumentList '--staging','--smoke' -PassThru
          if (-not $proc.WaitForExit(45000)) { $proc.Kill(); throw 'extracted EXE smoke exceeded 45 seconds' }
          Get-Content "$bundle/SMOKE.txt"
          if ($proc.ExitCode -ne 0) { throw "extracted EXE IPC smoke exit $($proc.ExitCode)" }
          $proc = Start-Process -FilePath "$bundle/Shot2Agent.exe" -ArgumentList '--staging','--tray-smoke' -PassThru
          if (-not $proc.WaitForExit(45000)) { $proc.Kill(); throw 'extracted native tray smoke exceeded 45 seconds' }
          Get-Content "$bundle/TRAY-SMOKE.txt"
          if ($proc.ExitCode -ne 0) { throw "extracted native tray smoke exit $($proc.ExitCode)" }
          $proc = Start-Process -FilePath "$bundle/Shot2Agent.exe" -ArgumentList '--staging','--ui-smoke' -WindowStyle Hidden -PassThru
          if (-not $proc.WaitForExit(45000)) { $proc.Kill(); throw 'extracted WebView smoke exceeded 45 seconds' }
          Get-Content "$bundle/UI-SMOKE.txt"
          if ($proc.ExitCode -ne 0) { throw "extracted WebView smoke exit $($proc.ExitCode)" }
          Copy-Item "$bundle/UI-SMOKE.txt" build/UI-SMOKE.txt
          Copy-Item "$bundle/TRAY-SMOKE.txt" build/TRAY-SMOKE.txt
          Copy-Item "$bundle/PORTABLE-VERIFY.txt" build/PORTABLE-VERIFY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Shot2Agent-Windows-x64
          path: |
            build/Shot2Agent-Windows-x64.zip
            build/SHA256SUMS.txt
            build/PORTABLE-VERIFY.txt
            build/TRAY-SMOKE.txt
            build/UI-SMOKE.txt
          if-no-files-found: error
