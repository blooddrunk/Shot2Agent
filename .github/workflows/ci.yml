name: contract-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Node ${{ matrix.node }} contract checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Contract checks (no dependencies)
        run: npm test
