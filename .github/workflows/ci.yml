name: Local and Remote checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  m1:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Emulate downloaded Windows native helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content -LiteralPath packages/worker/src/gateway-credential.ps1 -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          Set-Content -LiteralPath packages/worker/src/claude-policy.ps1 -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
      - name: Downloaded Claude policy helper preflight (no model request)
        if: runner.os == 'Windows'
        run: node --experimental-strip-types scripts/windows/claude-policy-smoke.mjs packages/worker/src/process.ts
      - name: Isolated Windows secure-store preflight
        if: runner.os == 'Windows'
        run: node --experimental-strip-types --test packages/local/test/gateway-credentials.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: npm run check
        env:
          SHOT2AGENT_NATIVE_CLIPBOARD_TEST: ${{ runner.os == 'Windows' && '1' || '0' }}

  desktop-ui:
    name: Vue interaction and responsive evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: npm run desktop:test-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M7-UX-browser-evidence
          path: |
            build/ui-evidence
            build/ui-report
            build/ui-test-results

  relay-container:
    name: Remote Relay Compose persistence and restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: docker build -f deploy/relay/Dockerfile -t shot2agent-relay:m10-test .
      - run: node scripts/relay-container.mjs shot2agent-relay:m10-test
