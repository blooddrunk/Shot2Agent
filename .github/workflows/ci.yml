name: Local and Remote checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  m1:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run check
        env:
          SHOT2AGENT_NATIVE_CLIPBOARD_TEST: ${{ runner.os == 'Windows' && '1' || '0' }}
